<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071013">
  <title>View 3D Design in AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: #071013; color: #f4ffff; }
    main { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
    header { padding: 18px 20px 8px; text-align: center; }
    h1 { margin: 0 0 6px; font-size: clamp(22px, 5vw, 34px); }
    p { margin: 0; color: #a9c1c3; font-size: 14px; }
    model-viewer { width: 100%; min-height: 62dvh; background: radial-gradient(circle, #173039 0%, #071013 68%); }
    .controls { padding: 14px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    button { appearance: none; border: 1px solid #236e70; border-radius: 999px; padding: 11px 17px; background: #102326; color: #f4ffff; font-weight: 700; cursor: pointer; }
    button.active { background: #00a9a3; border-color: #49f2e2; color: #021012; }
    .ar-button { border: 0; border-radius: 999px; padding: 14px 22px; background: #00b8b0; color: #021012; font-weight: 800; box-shadow: 0 0 24px rgb(0 184 176 / 45%); }
    .hint { width: 100%; text-align: center; color: #8ba4a7; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>View the design in 3D</h1>
      <p>Drag to rotate, pinch to zoom, or place it in your space.</p>
    </header>

    <model-viewer id="viewer"
      src="models/asset-2.gltf"
      alt="Interactive 3D design"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="auto"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      exposure="1"
      touch-action="pan-y">
      <button class="ar-button" slot="ar-button">View in your space</button>
    </model-viewer>

    <section class="controls" aria-label="Choose model">
      <button type="button" data-src="models/asset-1.gltf">Asset 1</button>
      <button type="button" class="active" data-src="models/asset-2.gltf">Asset 2</button>
      <div class="hint">The AR button appears on compatible iPhone and Android devices.</div>
    </section>
  </main>

  <script>
    const viewer = document.querySelector('#viewer');
    document.querySelectorAll('[data-src]').forEach((button) => {
      button.addEventListener('click', () => {
        viewer.src = button.dataset.src;
        document.querySelectorAll('[data-src]').forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
      });
    });
  </script>
</body>
</html>
